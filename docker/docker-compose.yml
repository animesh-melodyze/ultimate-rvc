services:
  ultimate-rvc:
    # CLI-only image. Example invocation:
    #   docker compose run --rm ultimate-rvc generate convert-voice \
    #     /app/audio/input.wav /app/audio "<voice-model-name>"
    # For CPU-only hosts: URVC_ACCELERATOR=cpu docker compose build
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        URVC_ACCELERATOR: ${URVC_ACCELERATOR:-cuda}
    image: ultimate-rvc-app:latest
    container_name: ultimate-rvc
    volumes:
      - ../models:/app/models
      - ../audio:/app/audio
      - ../logs:/app/logs
      - ../temp:/app/temp
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G
          # Uncomment when running with URVC_ACCELERATOR=cuda and an NVIDIA
          # driver is available on the host.
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]
